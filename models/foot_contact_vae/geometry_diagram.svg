<text x="48" y="48" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" fill="#202b38" font-weight="bold" text-anchor="start">What the foot geometry prior and encoder are doing</text>
<rect x="40" y="75" width="650" height="560" rx="16" fill="#ffffff" stroke="#d7dee7" stroke-width="2"/>
<rect x="710" y="75" width="730" height="560" rx="16" fill="#ffffff" stroke="#d7dee7" stroke-width="2"/>
<rect x="40" y="660" width="1400" height="275" rx="16" fill="#ffffff" stroke="#d7dee7" stroke-width="2"/>
<text x="68" y="116" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#202b38" font-weight="bold" text-anchor="start">1. SMPL-derived support geometry</text>
<text x="68" y="146" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#5d6b7b" font-weight="normal" text-anchor="start">Mean points; 90% ellipses enlarged 3× for visibility.</text>
<text x="200" y="185" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#202b38" font-weight="bold" text-anchor="middle">Left foot</text>
<line x1="129.0" y1="490.0" x2="129.0" y2="364.0" stroke="#e9edf2"/>
<line x1="199.0" y1="490.0" x2="199.0" y2="364.0" stroke="#e9edf2"/>
