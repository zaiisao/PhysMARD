<ellipse cx="251.39" cy="414.07" rx="27.57" ry="6.33" transform="rotate(-13.39 251.39 414.07)" fill="#2878b5" fill-opacity="0.14" stroke="#2878b5" stroke-width="2"/>
<circle cx="251.39" cy="414.07" r="5" fill="#2878b5"/>
<text x="251.38835321068765" y="401.0731812108059" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2878b5" font-weight="bold" text-anchor="start">pad</text>
<ellipse cx="325.35" cy="381.36" rx="18.33" ry="5.43" transform="rotate(-17.58 325.35 381.36)" fill="#35956d" fill-opacity="0.14" stroke="#35956d" stroke-width="2"/>
<circle cx="325.35" cy="381.36" r="5" fill="#35956d"/>
<text x="333.3473423624039" y="373.35709400123324" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#35956d" font-weight="bold" text-anchor="start">tip</text>
<circle cx="129.0" cy="389.2" r="4" fill="#202b38"/>
<circle cx="269.0" cy="389.2" r="4" fill="#202b38"/>
<line x1="136.0" y1="380.8" x2="246.6" y2="380.8" stroke="#506174" stroke-width="2" marker-end="url(#arrow)"/>
<text x="185.0" y="372.4" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#506174" font-weight="normal" text-anchor="middle">ankle-to-toe</text>
<text x="123.0" y="480.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#506174" font-weight="normal" text-anchor="end">ankle</text>
<text x="269.0" y="480.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#506174" font-weight="normal" text-anchor="middle">toe joint</text>
<text x="200" y="535" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#647384" font-weight="normal" text-anchor="middle">coordinates are in ankle-to-toe foot lengths</text>
<text x="515" y="185" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#202b38" font-weight="bold" text-anchor="middle">Right foot</text>
<line x1="444.0" y1="490.0" x2="444.0" y2="364.0" stroke="#e9edf2"/>
<line x1="514.0" y1="490.0" x2="514.0" y2="364.0" stroke="#e9edf2"/>
<line x1="584.0" y1="490.0" x2="584.0" y2="364.0" stroke="#e9edf2"/>
<line x1="654.0" y1="490.0" x2="654.0" y2="364.0" stroke="#e9edf2"/>
<line x1="402.0" y1="389.2" x2="654.0" y2="389.2" stroke="#8795a5" stroke-dasharray="6 5"/>
<line x1="444.0" y1="490.0" x2="444.0" y2="364.0" stroke="#8795a5" stroke-dasharray="6 5"/>
<ellipse cx="428.03" cy="458.71" rx="9.21" ry="5.64" transform="rotate(15.28 428.03 458.71)" fill="#e07a39" fill-opacity="0.14" stroke="#e07a39" stroke-width="2"/>
<circle cx="428.03" cy="458.71" r="5" fill="#e07a39"/>
<text x="416.03361083924773" y="447.70969152358794" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#e07a39" font-weight="bold" text-anchor="start">heel</text>
<ellipse cx="564.23" cy="415.89" rx="11.13" ry="6.60" transform="rotate(-35.86 564.23 415.89)" fill="#2878b5" fill-opacity="0.14" stroke="#2878b5" stroke-width="2"/>
<circle cx="564.23" cy="415.89" r="5" fill="#2878b5"/>
<text x="564.2296043944359" y="402.89207155497206" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2878b5" font-weight="bold" text-anchor="start">pad</text>
<ellipse cx="641.13" cy="388.66" rx="12.90" ry="11.01" transform="rotate(-63.56 641.13 388.66)" fill="#35956d" fill-opacity="0.14" stroke="#35956d" stroke-width="2"/>
<circle cx="641.13" cy="388.66" r="5" fill="#35956d"/>
<text x="649.1334149599076" y="380.6579127348016" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#35956d" font-weight="bold" text-anchor="start">tip</text>
<circle cx="444.0" cy="389.2" r="4" fill="#202b38"/>
<circle cx="584.0" cy="389.2" r="4" fill="#202b38"/>
<line x1="451.0" y1="380.8" x2="561.6" y2="380.8" stroke="#506174" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500.0" y="372.4" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#506174" font-weight="normal" text-anchor="middle">ankle-to-toe</text>
<text x="438.0" y="480.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#506174" font-weight="normal" text-anchor="end">ankle</text>
<text x="584.0" y="480.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#506174" font-weight="normal" text-anchor="middle">toe joint</text>
<text x="515" y="535" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#647384" font-weight="normal" text-anchor="middle">coordinates are in ankle-to-toe foot lengths</text>
<text x="68" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#354454" font-weight="normal" text-anchor="start">Each foot has a 6D mean and a 6×6 covariance across 1,000 SMPL body shapes.</text>
<text x="68" y="605" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#354454" font-weight="normal" text-anchor="start">The covariance captures how heel, pad and tip positions vary together.</text>
<text x="738" y="116" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#202b38" font-weight="bold" text-anchor="start">2. The encoder learns a distribution around that prior</text>
<rect x="745" y="155" width="290" height="100" rx="12" fill="#f8fafc" stroke="#aebdcd" stroke-width="2"/>
<text x="761" y="191" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#202b38" font-weight="bold" text-anchor="start">Encoder output (27 numbers)</text>
<text x="761" y="224" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#4d5e70" font-weight="normal" text-anchor="start">6 mean adjustments + 21 scale values</text>
<rect x="1085" y="155" width="315" height="100" rx="12" fill="#f8fafc" stroke="#aebdcd" stroke-width="2"/>
<text x="1101" y="191" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#202b38" font-weight="bold" text-anchor="start">Standardized geometry z</text>
<text x="1101" y="224" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#4d5e70" font-weight="normal" text-anchor="start">z = μ + L ε,   ε ~ N(0, I)</text>
<rect x="900" y="315" width="330" height="105" rx="12" fill="#f8fafc" stroke="#aebdcd" stroke-width="2"/>
<text x="916" y="351" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#202b38" font-weight="bold" text-anchor="start">Sampled foot geometry g</text>
<text x="916" y="384" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#4d5e70" font-weight="normal" text-anchor="start">g = μₚ + Lₚ z</text>
<line x1="1037" y1="205" x2="1074" y2="205" stroke="#2878b5" stroke-width="3" marker-end="url(#arrowblue)"/>
<path d="M1240 265 C1240 294, 1210 300, 1174 308" fill="none" stroke="#2878b5" stroke-width="3" marker-end="url(#arrowblue)"/>
<text x="1245" y="292" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2878b5" font-weight="normal" text-anchor="middle">apply prior</text>
<rect x="745" y="315" width="125" height="105" rx="12" fill="#fff8e9" stroke="#d7b66c" stroke-width="2"/>
<text x="807" y="353" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#7a5a18" font-weight="bold" text-anchor="middle">JSON prior</text>
<text x="807" y="382" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#7a5a18" font-weight="normal" text-anchor="middle">μₚ, Σₚ</text>
<line x1="878" y1="368" x2="890" y2="368" stroke="#d09a27" stroke-width="3" marker-end="url(#arrow)"/>
<text x="738" y="458" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#354454" font-weight="normal" text-anchor="start">L is lower triangular; its diagonal is exponentiated so scales stay positive.</text>
<text x="738" y="487" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#354454" font-weight="normal" text-anchor="start">Lₚ is the Cholesky factor of the prior covariance Σₚ.</text>
<text x="738" y="532" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#354454" font-weight="bold" text-anchor="start">At initialization: μ = 0 and L = I, so sampled g follows the SMPL prior.</text>
<text x="738" y="575" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#354454" font-weight="normal" text-anchor="start">The KL penalty is KL[N(μ, LLᵀ) || N(0, I)] in standardized coordinates.</text>
<text x="68" y="700" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#202b38" font-weight="bold" text-anchor="start">3. How sampled geometry contributes to training</text>
<rect x="70" y="740" width="280" height="115" rx="12" fill="#f8fafc" stroke="#aebdcd" stroke-width="2"/>
<text x="84" y="771" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#202b38" font-weight="bold" text-anchor="start">Sample geometry gₖ</text>
<text x="84" y="798" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#4d5e70" font-weight="normal" text-anchor="start">Compute support-point positions, then</text>
<text x="84" y="819" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#4d5e70" font-weight="normal" text-anchor="start">score contact states from heights,</text>
<text x="84" y="840" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#4d5e70" font-weight="normal" text-anchor="start">pitch and speeds.</text>
<rect x="430" y="740" width="285" height="115" rx="12" fill="#f8fafc" stroke="#aebdcd" stroke-width="2"/>
<text x="444" y="771" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#202b38" font-weight="bold" text-anchor="start">Sum over contact sequences</text>
<text x="444" y="798" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#4d5e70" font-weight="normal" text-anchor="start">The HMM forward algorithm calculates</text>
<text x="444" y="819" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#4d5e70" font-weight="normal" text-anchor="start">log Zₖ exactly; contact states are not</text>
<text x="444" y="840" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#4d5e70" font-weight="normal" text-anchor="start">sampled.</text>
<rect x="800" y="740" width="250" height="115" rx="12" fill="#f8fafc" stroke="#aebdcd" stroke-width="2"/>
<text x="814" y="771" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#202b38" font-weight="bold" text-anchor="start">Average geometry scores</text>
<text x="814" y="798" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#4d5e70" font-weight="normal" text-anchor="start">Mean of log Zₖ across K geometry</text>
<text x="814" y="819" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#4d5e70" font-weight="normal" text-anchor="start">samples.</text>
<rect x="1130" y="740" width="260" height="115" rx="12" fill="#f8fafc" stroke="#aebdcd" stroke-width="2"/>
<text x="1144" y="771" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#202b38" font-weight="bold" text-anchor="start">Subtract geometry KL</text>
<text x="1144" y="798" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#4d5e70" font-weight="normal" text-anchor="start">ELBO = mean(log Zₖ) − KL(q ||</text>
<text x="1144" y="819" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#4d5e70" font-weight="normal" text-anchor="start">prior).</text>
<line x1="355" y1="797" x2="420" y2="797" stroke="#506174" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="720" y1="797" x2="790" y2="797" stroke="#506174" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="1055" y1="797" x2="1120" y2="797" stroke="#506174" stroke-width="3" marker-end="url(#arrow)"/>
<text x="70" y="895" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#354454" font-weight="bold" text-anchor="start">This is a full-covariance VAE: the encoder can represent correlations among all six geometry coordinates.</text>
</svg>
